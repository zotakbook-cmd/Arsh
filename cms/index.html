<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arsh CMS — Image Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="loginView" class="login-shell hidden">
  <div class="login-card">
    <div class="brand-mark">A</div>
    <span class="eyebrow">ARSH TECHNICAL ACADEMY</span>
    <h1>Image CMS</h1>
    <p>Manage website images directly from GitHub.</p>
    <form id="loginForm">
      <label>Admin Password<input id="password" type="password" autocomplete="current-password" required placeholder="Enter password"></label>
      <button class="primary" type="submit">Sign in</button>
      <div id="loginError" class="error"></div>
    </form>
  </div>
</div>

<div id="appView" class="app hidden">
  <aside class="sidebar">
    <div class="sidebar-brand"><div class="brand-mark small">A</div><div><strong>Arsh CMS</strong><span>Image Manager</span></div></div>
    <nav>
      <button class="nav active" data-view="images">▦ <span>Images</span></button>
      <button class="nav" data-view="upload">＋ <span>Upload</span></button>
    </nav>
    <div class="sidebar-bottom"><a href="/" target="_blank">↗ Open Website</a><button id="logoutBtn">⇥ Logout</button></div>
  </aside>

  <main class="main">
    <header class="topbar"><div><div class="crumb">MEDIA / ASSETS</div><h2 id="pageTitle">Images</h2></div><button id="refreshBtn" class="icon-btn" title="Refresh">↻</button></header>
    <section id="imagesView" class="view">
      <div class="toolbar">
        <div class="search"><span>⌕</span><input id="search" placeholder="Search images..."></div>
        <select id="folderFilter"><option value="">All folders</option></select>
        <button class="primary" id="uploadBtn">＋ Upload image</button>
      </div>
      <div id="stats" class="stats"></div>
      <div id="grid" class="grid"></div>
    </section>

    <section id="uploadView" class="view hidden">
      <div class="upload-panel">
        <div id="dropZone" class="drop-zone"><div class="drop-icon">↑</div><h3>Drop images here</h3><p>or choose files from your computer · JPG, PNG, WEBP, GIF, SVG, AVIF · max 8 MB</p><input id="fileInput" type="file" accept="image/*" multiple></div>
        <div class="upload-options">
          <label>Folder<select id="uploadFolder"><option value="">assets/images</option></select></label>
          <label>Filename prefix<input id="filenamePrefix" placeholder="Optional"></label>
        </div>
        <div id="uploadQueue" class="queue"></div>
      </div>
    </section>
  </main>
</div>

<div id="modal" class="modal hidden"><div class="modal-card"><button class="modal-close" id="modalClose">×</button><div id="modalBody"></div></div></div>
<div id="toast" class="toast"></div>
<script src="./app.js"></script>
</body>
</html>
