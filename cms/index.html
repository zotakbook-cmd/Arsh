<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GISI CMS</title>
<style>
:root{--p:#0f7a4d;--pd:#075634;--dark:#062d22;--bg:#f4f7f5;--card:#fff;--text:#21352d;--muted:#718078;--border:#dfe9e4;--danger:#c62828;--gold:#f4c542;--shadow:0 16px 50px rgba(6,45,34,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login-screen{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 15%,rgba(244,197,66,.15),transparent 28%),linear-gradient(135deg,#031f17,#0b6345)}
.login-card{width:min(430px,100%);background:#fff;border-radius:28px;padding:32px;box-shadow:0 35px 100px rgba(0,0,0,.25)}.logo{width:64px;height:64px;border-radius:18px;background:#eaf6f0;display:grid;place-items:center;color:var(--p);font-size:28px;margin-bottom:18px}.login-card h1{margin:0;color:var(--dark);font-size:28px}.login-card p{color:var(--muted);line-height:1.6}.field{display:grid;gap:7px;margin:15px 0}.field label{font-size:12px;font-weight:800;color:#355047}.field input,.field textarea,.field select{width:100%;border:1px solid var(--border);border-radius:12px;padding:12px 13px;outline:none;background:#fbfdfc}.field textarea{min-height:110px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--p);box-shadow:0 0 0 4px rgba(15,122,77,.08)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800}.btn-primary{background:var(--p);color:#fff}.btn-primary:hover{background:var(--pd)}.btn-secondary{background:#eaf5f0;color:var(--p)}.btn-danger{background:#fff0f0;color:var(--danger)}.btn-dark{background:var(--dark);color:#fff}.login-error{min-height:22px;color:var(--danger);font-size:13px;font-weight:700;margin-top:10px}
.app{min-height:100dvh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:var(--dark);color:#fff;position:sticky;top:0;height:100dvh;padding:20px 14px;overflow:auto}.brand{display:flex;align-items:center;gap:10px;padding:8px 10px 22px;font-weight:900}.brand-badge{width:40px;height:40px;border-radius:12px;background:var(--gold);color:var(--dark);display:grid;place-items:center}.brand small{display:block;color:rgba(255,255,255,.58);font-size:10px;margin-top:2px}.side-nav{display:grid;gap:5px}.side-nav button{width:100%;text-align:left;background:transparent;border:0;color:rgba(255,255,255,.75);padding:11px 12px;border-radius:11px;font-weight:700}.side-nav button:hover,.side-nav button.active{background:rgba(255,255,255,.1);color:#fff}.side-nav i{width:23px;text-align:center;margin-right:7px}.sidebar-bottom{border-top:1px solid rgba(255,255,255,.1);margin-top:20px;padding-top:14px}.user-mini{font-size:12px;color:rgba(255,255,255,.65);padding:8px 10px 12px}.main{min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}.topbar h2{margin:0;color:var(--dark);font-size:21px}.top-actions{display:flex;gap:8px}.content{padding:28px;max-width:1500px;margin:auto}.dashboard-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.dash-card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:22px;box-shadow:var(--shadow)}.dash-card strong{display:block;font-size:30px;color:var(--dark)}.dash-card span{color:var(--muted);font-size:12px;font-weight:700}.panel{background:#fff;border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.panel-head h3{margin:0;color:var(--dark)}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.search{min-width:230px;border:1px solid var(--border);border-radius:11px;padding:10px 12px;outline:none}.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;min-width:800px}.data-table th,.data-table td{padding:12px 14px;border-bottom:1px solid #edf2ef;text-align:left;vertical-align:top;font-size:13px}.data-table th{background:#f8fbf9;color:#496158;font-size:11px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0}.data-table tr:hover td{background:#fbfdfc}.actions{display:flex;gap:6px;white-space:nowrap}.mini{border:0;border-radius:9px;padding:7px 9px;font-size:12px;font-weight:800}.empty{padding:35px;text-align:center;color:var(--muted)}.thumb{width:50px;height:42px;object-fit:cover;border-radius:8px;background:#edf3ef}.status{padding:4px 8px;border-radius:999px;background:#eaf6f0;color:var(--p);font-size:11px;font-weight:800}.modal{position:fixed;inset:0;background:rgba(3,20,14,.68);backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal.open{display:flex}.dialog{width:min(900px,100%);max-height:92dvh;overflow:auto;background:#fff;border-radius:24px;box-shadow:0 35px 100px rgba(0,0,0,.3)}.dialog-head{padding:20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}.dialog-head h3{margin:0}.close{width:38px;height:38px;border:0;border-radius:50%;background:#eef3f0;color:var(--dark)}.dialog-body{padding:20px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.form-grid .full{grid-column:1/-1}.image-field{display:grid;gap:8px}.image-row{display:flex;gap:8px;align-items:center}.image-row input{flex:1}.image-preview{width:82px;height:64px;object-fit:cover;border-radius:10px;background:#edf3ef;border:1px solid var(--border)}.dialog-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}.notice{position:fixed;right:20px;bottom:20px;z-index:500;padding:12px 16px;border-radius:12px;background:var(--dark);color:#fff;box-shadow:0 18px 50px rgba(0,0,0,.2);font-weight:700;font-size:13px;display:none}.notice.show{display:block}.mobile-menu{display:none;border:0;background:#eef5f1;color:var(--dark);width:42px;height:42px;border-radius:11px}.info{padding:16px 20px;background:#f8fbf9;color:var(--muted);font-size:12px;line-height:1.7}.danger-note{color:var(--danger);font-weight:700}
@media(max-width:1000px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;transform:translateX(-105%);transition:.25s;z-index:50}.sidebar.open{transform:none}.mobile-menu{display:block}.topbar{padding:0 16px}.content{padding:18px}.dashboard-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.dashboard-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.top-actions .btn{padding:9px 11px}.search{min-width:150px;width:100%}.panel-head{align-items:stretch}.toolbar{width:100%}.toolbar .search{flex:1}.dialog{border-radius:20px}.content{padding:12px}.topbar h2{font-size:18px}}

/* Production CMS enhancements */
.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.quick-card{background:#fff;border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:20px}.quick-card h3{margin:0 0 5px;color:var(--dark)}.quick-card p{margin:0 0 16px;color:var(--muted);font-size:12px;line-height:1.6}.settings-section{background:#fff;border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:20px;margin-bottom:16px}.settings-section h3{margin:0;color:var(--dark)}.settings-section .sub{color:var(--muted);font-size:12px;margin:5px 0 18px}.color-field{display:flex;gap:8px;align-items:center}.color-field input[type=color]{width:52px;height:42px;padding:3px;border:1px solid var(--border);border-radius:10px;background:#fff}.settings-actions{display:flex;gap:8px;flex-wrap:wrap;position:sticky;bottom:12px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);padding:10px;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);z-index:5}.preview-frame{width:100%;height:420px;border:1px solid var(--border);border-radius:16px;background:#fff}.image-manager{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.image-manager .field{margin:0}.cms-link{color:var(--p);font-weight:800;text-decoration:none}.badge-soft{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eef8f3;color:var(--p);font-size:11px;font-weight:800}.hint{font-size:11px;color:var(--muted);line-height:1.6}.section-preview-links{display:flex;flex-wrap:wrap;gap:7px}.section-preview-links a{padding:8px 10px;border-radius:10px;background:#f2f7f4;color:var(--p);font-size:12px;font-weight:800;text-decoration:none}.upload-small{display:flex;gap:8px;align-items:center}.upload-small input{flex:1}
@media(max-width:700px){.quick-grid,.image-manager{grid-template-columns:1fr}.preview-frame{height:330px}.settings-section{padding:15px}.settings-actions{bottom:6px}}
</style>
</head>
<body>
<section id="loginScreen" class="login-screen">
  <form id="loginForm" class="login-card">
    <div class="logo"><i class="fa-solid fa-shield-halved"></i></div>
    <h1>Green India CMS</h1>
    <p>Authorised administration panel. Website text, menus, courses, staff, gallery, notices and other Google Sheet data can be managed here.</p>
    <div class="field"><label>User ID</label><input id="loginUser" autocomplete="username" required></div>
    <div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-primary" style="width:100%" type="submit">Sign in</button>
    <div id="loginError" class="login-error"></div>
  </form>
</section>

<div id="app" class="app hidden">
  <aside id="sidebar" class="sidebar">
    <div class="brand"><div class="brand-badge"><i class="fa-solid fa-shield-halved"></i></div><div>Green India<small>Website CMS</small></div></div>
    <nav id="sideNav" class="side-nav"></nav>
    <div class="sidebar-bottom"><div id="userMini" class="user-mini"></div><button id="logoutBtn" class="btn btn-secondary" style="width:100%">Logout</button></div>
  </aside>
  <main class="main">
    <header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button id="mobileMenu" class="mobile-menu"><i class="fa-solid fa-bars"></i></button><h2 id="pageTitle">Dashboard</h2></div><div class="top-actions"><a class="btn btn-secondary" href="/" target="_blank">View Website ↗</a></div></header>
    <div id="content" class="content"></div>
  </main>
</div>

<div id="editorModal" class="modal"><div class="dialog"><div class="dialog-head"><h3 id="editorTitle">Edit</h3><button class="close" data-close="editorModal">×</button></div><div id="editorBody" class="dialog-body"></div><div class="dialog-foot"><button class="btn btn-secondary" data-close="editorModal">Cancel</button><button id="saveRowBtn" class="btn btn-primary">Save changes</button></div></div></div>
<div id="notice" class="notice"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbw9rOT_EtD4MUmGcCJK0AqKme2K1DURQB4i636Oko-q-vWdq5P7KeU92JGcB43h4zAm/exec";
const PUBLIC_ORIGIN=location.origin;
const SHEET_MENU=[
 ["Settings","Website Settings","fa-gear"],["Menu","Menu Manager","fa-bars"],["Hero","Hero Slider","fa-images"],["Stats","Stats","fa-chart-simple"],["About","About","fa-circle-info"],["AboutPoints","About Points","fa-list-check"],["Features","Features","fa-star"],["CourseDB","Courses","fa-book-open"],["Faculty","Faculty","fa-chalkboard-user"],["Gallery","Gallery","fa-image"],["Testimonials","Testimonials","fa-comments"],["Notices","Notices","fa-bell"],["Contact","Contact","fa-address-book"],["Social","Social Links","fa-share-nodes"],["FAQ","FAQ","fa-circle-question"],["LearningJourney","Learning Journey","fa-route"],["InstitutePromise","Institute Promise","fa-hand-holding-heart"],["StudentDB","Students","fa-user-graduate"]
];
let TOKEN=localStorage.getItem("gisi_cms_token")||"";let CMS=null;let currentSheet="";let currentRows=[];let editRow=0;let editorData={};
function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function jsonp(action,params={}){return new Promise((resolve,reject)=>{const cb="cmsCb_"+Date.now()+Math.random().toString(36).slice(2);const s=document.createElement("script");const q=new URLSearchParams({action,callback:cb,...params});let done=false;const finish=(fn,v)=>{if(done)return;done=true;clearTimeout(t);try{delete window[cb]}catch(e){}s.remove();fn(v)};const t=setTimeout(()=>finish(reject,new Error("Request timeout")),20000);window[cb]=d=>finish(resolve,d);s.onerror=()=>finish(reject,new Error("API request failed"));s.src=API_URL+"?"+q.toString();document.body.appendChild(s)})}
function postPopup(action,params){return new Promise((resolve,reject)=>{const w=window.open("about:blank","gisiCmsWrite","width=520,height=620");if(!w){reject(new Error("Popup blocked. Please allow popups for the CMS."));return}const f=w.document.createElement("form");f.method="POST";f.action=API_URL;f.target="_self";f.style.display="none";Object.entries({action,...params,returnOrigin:PUBLIC_ORIGIN}).forEach(([k,v])=>{const i=w.document.createElement("input");i.name=k;i.value=v==null?"":String(v);f.appendChild(i)});w.document.body.appendChild(f);window.addEventListener("message",function handler(e){if(e.origin!==PUBLIC_ORIGIN)return;if(!e.data||e.data.type!=="GISI_CMS_RESULT")return;window.removeEventListener("message",handler);try{w.close()}catch(x){} if(e.data.data&&e.data.data.success)resolve(e.data.data);else reject(new Error((e.data.data&&e.data.data.message)||"Operation failed"))},{once:true});f.submit()})}
function notify(msg,good=true){const n=document.getElementById("notice");n.textContent=msg;n.style.background=good?"var(--dark)":"var(--danger)";n.classList.add("show");setTimeout(()=>n.classList.remove("show"),2800)}
async function login(e){e.preventDefault();const err=document.getElementById("loginError");err.textContent="Signing in…";try{const d=await jsonp("cmsLogin",{userId:document.getElementById("loginUser").value.trim(),password:document.getElementById("loginPass").value});if(!d.success)throw new Error(d.message||"Login failed");TOKEN=d.token;localStorage.setItem("gisi_cms_token",TOKEN);await boot()}catch(x){err.textContent=x.message||"Login failed."}}
async function boot(){if(!TOKEN){showLogin();return}try{const d=await jsonp("getCMSData",{token:TOKEN});if(!d.success)throw new Error(d.message||"CMS load failed");CMS=d;showApp();renderNav();openDashboard()}catch(e){localStorage.removeItem("gisi_cms_token");TOKEN="";showLogin();document.getElementById("loginError").textContent=e.message||"Session expired."}}
function showLogin(){document.getElementById("loginScreen").classList.remove("hidden");document.getElementById("app").classList.add("hidden")}
function showApp(){document.getElementById("loginScreen").classList.add("hidden");document.getElementById("app").classList.remove("hidden");document.getElementById("userMini").textContent=(CMS.user.name||CMS.user.userId)+" • "+(CMS.user.adminType||"Admin")}
function renderNav(){document.getElementById("sideNav").innerHTML=SHEET_MENU.map(([s,t,i])=>`<button data-sheet="${esc(s)}"><i class="fa-solid ${esc(i)}"></i>${esc(t)}</button>`).join("");document.querySelectorAll("#sideNav button").forEach(b=>b.onclick=()=>b.dataset.sheet==="Settings"?openWebsiteSettings():openSheet(b.dataset.sheet))}
function setActive(sheet){document.querySelectorAll("#sideNav button").forEach(b=>b.classList.toggle("active",b.dataset.sheet===sheet))}
function openWebsiteSettings(){
  currentSheet="Settings"; setActive("Settings");
  document.getElementById("pageTitle").textContent="Website Settings";
  const settings={};
  const rows=(CMS.sheets.Settings&&CMS.sheets.Settings.rows)||[];
  rows.forEach(r=>{const k=String(r["Key"]||r["Setting"]||r["Name"]||"").trim();if(k)settings[k]=r["Value"]!=null?r["Value"]:"";});
  const get=(k,d="")=>settings[k]!==undefined&&settings[k]!==""?settings[k]:d;
  const color=(id,label,key,def)=>`<div class="field"><label>${esc(label)}</label><div class="color-field"><input id="${id}" type="color" value="${esc(get(key,def))}"><input id="${id}_text" value="${esc(get(key,def))}" placeholder="#0f7a4d"></div></div>`;
  const text=(id,label,key,def="",full=false)=>`<div class="field ${full?'full':''}"><label>${esc(label)}</label>${full?`<textarea id="${id}">${esc(get(key,def))}</textarea>`:`<input id="${id}" value="${esc(get(key,def))}">`}</div>`;
  const image=(id,label,key,folder)=>`<div class="field image-field"><label>${esc(label)}</label><div class="image-row"><input id="${id}" value="${esc(get(key,""))}" placeholder="GitHub image URL"><button type="button" class="btn btn-secondary" onclick="uploadSettingImage('${id}','${folder}')">Upload</button></div><img id="${id}_preview" class="image-preview" src="${esc(get(key,""))}" ${get(key,"")?'':'style="display:none"'} onerror="this.style.display='none'"><div class="hint">Upload goes directly through Apps Script to GitHub. The GitHub token never reaches this browser.</div></div>`;
  const sectionKeys=[
    ["features","Features"],["courses","Courses"],["faculty","Faculty"],["gallery","Gallery"],["testimonials","Testimonials"],["notices","Notices"],["contact","Contact"],["cta","CTA"]
  ];
  document.getElementById("content").innerHTML=`
    <div class="settings-section"><h3>Theme Manager</h3><div class="sub">Change the visual identity of the public website without editing code.</div><div class="form-grid">${color("primary_color","Primary color","primary_color","#0f7a4d")}${color("secondary_color","Secondary color","secondary_color","#062d22")}${color("accent_color","Accent color","accent_color","#f4c542")}${color("light_color","Light background","light_color","#f4f8f6")}${color("text_color","Text color","text_color","#28352f")}${color("muted_color","Muted text","muted_color","#718078")}${color("border_color","Border color","border_color","#dce9e3")}</div></div>
    <div class="settings-section"><h3>Brand & SEO</h3><div class="sub">Branding, browser title, search metadata and social preview.</div><div class="form-grid">${text("site_name","Site / institute name","site_name","Green India Safety Institute")}${text("seo_title","SEO title","seo_title",get("site_name","Green India Safety Institute"))}${text("seo_keywords","SEO keywords","seo_keywords","Safety Institute, training, courses")}${text("seo_description","SEO description","seo_description","",true)}${image("logo_url","Main logo","logo_url","assets/images/logo")}${image("favicon_url","Favicon","favicon_url","assets/images/logo")}${image("og_image_url","Social / OG image","og_image_url","assets/images/seo")}</div></div>
    <div class="settings-section"><h3>Hero & Section Images</h3><div class="sub">Upload/replace the images used by the public site. Hero supports up to five slides.</div><div class="image-manager">${[1,2,3,4,5].map(i=>image("hero_"+i+"_image","Hero slide "+i,"hero_"+i+"_image","assets/images/hero")).join("")}${image("about_image","About image","about_image","assets/images/about")}</div></div>
    <div class="settings-section"><h3>Section Headings</h3><div class="sub">These values control the heading/description shown above dynamic sections.</div><div class="form-grid">${sectionKeys.map(([k,label])=>text(k+"_label",label+" label",k+"_label","" )+text(k+"_title",label+" title",k+"_title","" )+text(k+"_description",label+" description",k+"_description","",true)).join("")}</div></div>
    <div class="settings-section"><h3>Preview & Navigation</h3><div class="sub">Open the live website and jump directly to the main sections.</div><div class="section-preview-links"><a href="/" target="_blank">Home</a><a href="/?#about" target="_blank">About</a><a href="/?#features" target="_blank">Features</a><a href="/?#courses" target="_blank">Courses</a><a href="/?#faculty" target="_blank">Faculty</a><a href="/?#staff" target="_blank">Our Team</a><a href="/?#gallery" target="_blank">Gallery</a><a href="/?#testimonials" target="_blank">Testimonials</a><a href="/?#notices" target="_blank">Notices</a><a href="/?#contact" target="_blank">Contact</a><a href="/?#faq" target="_blank">FAQ</a></div><div style="height:14px"></div><iframe class="preview-frame" src="/" loading="lazy" title="Website preview"></iframe></div>
    <div class="settings-actions"><button class="btn btn-primary" id="saveSettingsBtn">Save all website settings</button><button class="btn btn-secondary" id="refreshSettingsBtn">Reload</button><a class="btn btn-dark" href="/" target="_blank">Open live website ↗</a></div>`;
  document.querySelectorAll('.color-field input[type=color]').forEach(c=>{const t=document.getElementById(c.id+'_text');c.oninput=()=>t.value=c.value;t.onchange=()=>t.value=c.value;t.onblur=()=>{if(/^#[0-9a-f]{6}$/i.test(t.value))c.value=t.value};});
  document.querySelectorAll('.color-field input[id$="_text"]').forEach(t=>{t.oninput=()=>{if(/^#[0-9a-f]{6}$/i.test(t.value)){const c=document.getElementById(t.id.replace(/_text$/,''));if(c)c.value=t.value;}}});
  document.getElementById('saveSettingsBtn').onclick=saveWebsiteSettings;
  document.getElementById('refreshSettingsBtn').onclick=openWebsiteSettings;
}
function collectWebsiteSettings(){
  const keys=['site_name','seo_title','seo_description','seo_keywords','logo_url','favicon_url','og_image_url','about_image','primary_color','secondary_color','accent_color','light_color','text_color','muted_color','border_color'];
  for(let i=1;i<=5;i++)keys.push('hero_'+i+'_image');
  ['features','courses','faculty','gallery','testimonials','notices','contact','cta'].forEach(k=>keys.push(k+'_label',k+'_title',k+'_description'));
  const out={};keys.forEach(k=>{const el=document.getElementById(k);if(el)out[k]=el.value;});return out;
}
async function saveWebsiteSettings(){try{const btn=document.getElementById('saveSettingsBtn');btn.disabled=true;notify('Saving website settings…');const res=await postPopup('cmsSaveSettings',{token:TOKEN,settingsJson:JSON.stringify(collectWebsiteSettings())});if(!res.success)throw new Error(res.message||'Save failed');await refreshCMSAll();notify('Website settings saved successfully.');openWebsiteSettings();}catch(e){notify(e.message||'Save failed',false)}finally{const b=document.getElementById('saveSettingsBtn');if(b)b.disabled=false}}
async function refreshCMSAll(){const d=await jsonp('getCMSData',{token:TOKEN});if(!d.success)throw new Error(d.message||'CMS refresh failed');CMS=d;}
async function uploadSettingImage(id,folder){const input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=async()=>{if(!input.files[0])return;try{notify('Preparing image…');const prepared=await compressImage(input.files[0]);const res=await postPopup('uploadGitHubImage',{token:TOKEN,fileName:prepared.name,mimeType:prepared.type,base64:prepared.base64,folder:folder});if(!res.success)throw new Error(res.message||'Upload failed');const el=document.getElementById(id);if(el)el.value=res.url;const preview=document.getElementById(id+'_preview');if(preview){preview.src=res.url;preview.style.display='block'}notify('Image uploaded to GitHub. Save settings to publish it.')}catch(e){notify(e.message||'Upload failed',false)}};input.click()}
function openDashboard(){currentSheet="";setActive("");document.getElementById("pageTitle").textContent="Dashboard";const counts=SHEET_MENU.map(([s,t])=>[s,t,(CMS.sheets[s]&&CMS.sheets[s].rows||[]).length]);document.getElementById("content").innerHTML=`<div class="quick-grid"><div class="quick-card"><h3>Website Settings</h3><p>Theme, logo, hero images, SEO and section headings are managed from one screen.</p><button class="btn btn-primary" onclick="openWebsiteSettings()">Open Website Settings</button></div><div class="quick-card"><h3>Live Preview</h3><p>Open the public website in a new tab and check changes after saving.</p><a class="btn btn-dark" href="/" target="_blank">Open Website ↗</a></div></div><div style="height:18px"></div><div class="dashboard-grid">${counts.slice(0,8).map(x=>`<div class="dash-card"><strong>${x[2]}</strong><span>${esc(x[1])}</span></div>`).join("")}</div><div style="height:18px"></div><div class="panel"><div class="panel-head"><div><h3>Production CMS</h3></div><span class="badge-soft">Google Sheets + Apps Script + GitHub</span></div><div class="info">Use Website Settings for the common website controls. Use the individual sheet managers for courses, faculty, gallery, notices, FAQ, Learning Journey, Institute Promise, students and other records. GitHub tokens stay server-side.</div></div>`}
function sheetTitle(s){const x=SHEET_MENU.find(a=>a[0]===s);return x?x[1]:s}
function openSheet(sheet){currentSheet=sheet;setActive(sheet);const data=CMS.sheets[sheet]||{headers:[],rows:[]};currentRows=data.rows||[];document.getElementById("pageTitle").textContent=sheetTitle(sheet);renderSheet(data)}
function isImageHeader(h){return /(image|photo|picture|logo|banner|thumbnail|avatar|url)$/i.test(String(h||""))&&/(image|photo|picture|logo|banner|thumbnail|avatar)/i.test(String(h||""))}
function renderSheet(data){const headers=data.headers||[];const rows=currentRows;document.getElementById("content").innerHTML=`<div class="panel"><div class="panel-head"><div><h3>${esc(sheetTitle(currentSheet))}</h3><div style="font-size:12px;color:var(--muted);margin-top:3px">${rows.length} record(s)</div></div><div class="toolbar"><input id="tableSearch" class="search" placeholder="Search…"><button id="addBtn" class="btn btn-primary">+ Add New</button></div></div><div class="table-wrap"><table class="data-table"><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join("")}<th>Action</th></tr></thead><tbody id="tableBody"></tbody></table></div></div>`;drawRows(rows,headers);document.getElementById("tableSearch").oninput=e=>drawRows(rows.filter(r=>JSON.stringify(r).toLowerCase().includes(e.target.value.toLowerCase())),headers);document.getElementById("addBtn").onclick=()=>openEditor(0,{})}
function drawRows(rows,headers){const body=document.getElementById("tableBody");if(!rows.length){body.innerHTML=`<tr><td class="empty" colspan="${headers.length+1}">No records found.</td></tr>`;return}body.innerHTML=rows.map(r=>`<tr>${headers.map(h=>{const v=r[h]||"";return `<td>${isImageHeader(h)&&v?`<img class="thumb" src="${esc(v)}" onerror="this.style.opacity=.25">`:esc(String(v).length>220?String(v).slice(0,220)+"…":v)}</td>`}).join("")}<td><div class="actions"><button class="mini btn-secondary" data-edit="${r.__row}">Edit</button><button class="mini btn-danger" data-del="${r.__row}">Delete</button></div></td></tr>`).join("");body.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{const r=rows.find(x=>String(x.__row)===b.dataset.edit)||{};openEditor(Number(b.dataset.edit),r)});body.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>deleteRow(Number(b.dataset.del)))}
function openEditor(rowIndex,row){editRow=rowIndex;editorData={...row};delete editorData.__row;const headers=(CMS.sheets[currentSheet]||{}).headers||[];document.getElementById("editorTitle").textContent=(rowIndex?"Edit ":"Add ")+sheetTitle(currentSheet);document.getElementById("editorBody").innerHTML=`<div class="form-grid">${headers.map((h,i)=>fieldHTML(h,row[h]||"",i===0&&rowIndex===0)).join("")}</div>`;document.getElementById("editorModal").classList.add("open");bindEditor();}
function fieldHTML(h,v,auto=false){const name=esc(h),value=esc(v);const low=String(h).toLowerCase();let full=/description|message|content|bio|address|note|template/i.test(low);if(isImageHeader(h)){return `<div class="field ${full?'full':''} image-field"><label>${name}</label><div class="image-row"><input data-key="${name}" value="${value}" placeholder="Image URL"><button type="button" class="btn btn-secondary uploadBtn" data-key="${name}">Upload</button><button type="button" class="btn btn-danger deleteImgBtn" data-key="${name}">Delete GitHub</button></div><img class="image-preview" data-preview="${name}" src="${value}" onerror="this.style.display='none'" ${value?'':'style="display:none"'}></div>`}if(/status|type|category|order|fee|duration|mobile|phone/i.test(low)){return `<div class="field ${full?'full':''}"><label>${name}</label><input data-key="${name}" value="${value}"></div>`}return `<div class="field ${full?'full':''}"><label>${name}</label>${full?`<textarea data-key="${name}">${value}</textarea>`:`<input data-key="${name}" value="${value}">`}</div>`}
function bindEditor(){document.querySelectorAll("[data-key]").forEach(el=>el.oninput=()=>{editorData[el.dataset.key]=el.value;if(el.dataset.key&&el.closest(".image-field")){const p=document.querySelector(`[data-preview="${CSS.escape(el.dataset.key)}"]`);if(p){p.src=el.value;p.style.display=el.value?"block":"none"}}});document.querySelectorAll(".uploadBtn").forEach(b=>b.onclick=()=>uploadForKey(b.dataset.key));document.querySelectorAll(".deleteImgBtn").forEach(b=>b.onclick=()=>deleteEditorImage(b.dataset.key))}
async function uploadForKey(key){const input=document.createElement("input");input.type="file";input.accept="image/*";input.onchange=async()=>{if(!input.files[0])return;try{notify("Preparing image…");const prepared=await compressImage(input.files[0]);const res=await postPopup("uploadGitHubImage",{token:TOKEN,fileName:prepared.name,mimeType:prepared.type,base64:prepared.base64,folder:imageFolder(currentSheet)});editorData[key]=res.url;const el=document.querySelector(`[data-key="${CSS.escape(key)}"]`);if(el)el.value=res.url;const p=document.querySelector(`[data-preview="${CSS.escape(key)}"]`);if(p){p.src=res.url;p.style.display="block"}notify("Image uploaded to GitHub.")}catch(e){notify(e.message||"Upload failed",false)}};input.click()}

async function deleteEditorImage(key){const el=document.querySelector(`[data-key="${CSS.escape(key)}"]`);const url=el?String(el.value||"").trim():String(editorData[key]||"").trim();if(!url){notify("No image URL to delete.",false);return}const base=location.origin.replace(/\/+$/g,"");if(url.indexOf(base+"/")!==0){notify("Only images hosted on this website can be deleted from GitHub.",false);return}if(!confirm("Delete this image permanently from GitHub? This can break other pages using the same image."))return;try{const path=decodeURIComponent(url.slice((base+"/").length));notify("Deleting image from GitHub…");await postPopup("deleteGitHubImage",{token:TOKEN,path:path});if(el)el.value="";editorData[key]="";const preview=document.querySelector(`[data-preview="${CSS.escape(key)}"]`);if(preview){preview.removeAttribute("src");preview.style.display="none"}notify("Image deleted from GitHub. Save the row to remove its URL.")}catch(e){notify(e.message||"Image delete failed",false)}}
function imageFolder(sheet){const m={Settings:"assets/images/logo",Hero:"assets/images/hero",About:"assets/images/about",CourseDB:"assets/images/courses",Faculty:"assets/images/faculty",Gallery:"assets/images/gallery",Testimonials:"assets/images/testimonials",StudentDB:"assets/images/students",LearningJourney:"assets/images/learning-journey",InstitutePromise:"assets/images/institute-promise"};return m[sheet]||"assets/images"}
function compressImage(file){return new Promise((resolve,reject)=>{if(file.type==="image/svg+xml"){const r=new FileReader();r.onload=()=>resolve({name:file.name,type:file.type,base64:String(r.result).split(",")[1]||""});r.onerror=reject;r.readAsDataURL(file);return}const img=new Image();const r=new FileReader();r.onload=()=>{img.onload=()=>{const max=1800;const scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=c.getContext("2d");ctx.drawImage(img,0,0,c.width,c.height);c.toBlob(blob=>{if(!blob)return reject(new Error("Image compression failed."));const rr=new FileReader();rr.onload=()=>resolve({name:(file.name.replace(/\.[^.]+$/i,"")||"image")+".webp",type:"image/webp",base64:String(rr.result).split(",")[1]||""});rr.readAsDataURL(blob)},"image/webp",.82)};img.onerror=()=>reject(new Error("Invalid image."));img.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
async function saveRow(){const body={};document.querySelectorAll("[data-key]").forEach(el=>body[el.dataset.key]=el.value);try{document.getElementById("saveRowBtn").disabled=true;notify("Saving…");const res=await postPopup("cmsSaveRow",{token:TOKEN,sheet:currentSheet,rowIndex:editRow,dataJson:JSON.stringify(body)});document.getElementById("editorModal").classList.remove("open");await refreshSheet();notify("Saved successfully.")}catch(e){notify(e.message||"Save failed",false)}finally{document.getElementById("saveRowBtn").disabled=false}}
async function deleteRow(row){if(!confirm("Delete this record permanently from Google Sheet?"))return;try{notify("Deleting…");await postPopup("cmsDeleteRow",{token:TOKEN,sheet:currentSheet,rowIndex:row});await refreshSheet();notify("Deleted successfully.")}catch(e){notify(e.message||"Delete failed",false)}}
async function refreshSheet(){const d=await jsonp("getCMSSheet",{token:TOKEN,sheet:currentSheet});if(!d.success)throw new Error(d.message||"Refresh failed");CMS.sheets[currentSheet]=d.data;currentRows=d.data.rows||[];renderSheet(d.data)}
document.getElementById("loginForm").addEventListener("submit",login);document.getElementById("saveRowBtn").onclick=saveRow;document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>document.getElementById(b.dataset.close).classList.remove("open"));document.getElementById("logoutBtn").onclick=()=>{localStorage.removeItem("gisi_cms_token");TOKEN="";showLogin()};document.getElementById("mobileMenu").onclick=()=>document.getElementById("sidebar").classList.toggle("open");
boot();
</script>
