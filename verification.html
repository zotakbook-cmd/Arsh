<!-- =========================================================
     CERTIFICATE VERIFICATION FRONTEND MODULE
     Paste the CSS + HTML + JS into Index.html.
     It uses the existing apiCall("verifyCertificate", params).
     ========================================================= -->
<style>
.certificate-modal{position:fixed;inset:0;background:rgba(3,20,14,.76);backdrop-filter:blur(9px);display:none;align-items:center;justify-content:center;padding:18px;z-index:1500}.certificate-modal.open{display:flex}.certificate-dialog{width:min(560px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:28px;box-shadow:0 30px 90px rgba(0,0,0,.35);padding:30px;position:relative}.certificate-close{position:absolute;right:14px;top:14px;width:38px;height:38px;border:0;border-radius:50%;background:#f1f5f3;color:#16382d;font-size:21px;cursor:pointer}.certificate-icon{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(135deg,#0f7a4d,#075634);color:#fff;font-size:22px;margin-bottom:14px}.certificate-dialog h3{margin:0 45px 7px 0;font-family:'Playfair Display',serif;font-size:30px;color:#075634}.certificate-dialog>p{margin:0 0 20px;color:#718078;line-height:1.6}.certificate-label{display:block;font-size:12px;font-weight:800;color:#355047;margin:0 0 6px}.certificate-input{width:100%;box-sizing:border-box;border:1px solid rgba(15,122,77,.16);border-radius:13px;padding:13px;background:#f8fbf9;font:inherit;outline:none;margin-bottom:14px}.certificate-input:focus{border-color:#0f7a4d;box-shadow:0 0 0 4px rgba(15,122,77,.08)}.certificate-submit{width:100%;height:50px;border:0;border-radius:14px;background:linear-gradient(135deg,#0f7a4d,#075634);color:#fff;font-weight:900;cursor:pointer}.certificate-submit:disabled{opacity:.65;cursor:not-allowed}.certificate-status{font-size:12px;text-align:center;color:#718078;margin:10px 0}.certificate-status.error{color:#b42318}.certificate-status.success{color:#0f7a4d}.certificate-result{display:none;margin-top:20px;padding:18px;border:1px solid rgba(15,122,77,.12);border-radius:20px;background:#f8fbf9}.certificate-result.show{display:block}.certificate-stamp{text-align:center;margin-bottom:16px}.verified-stamp{display:inline-flex;align-items:center;justify-content:center;width:122px;height:122px;border:5px solid #168a55;border-radius:50%;color:#168a55;font-weight:1000;font-size:17px;line-height:1.05;text-align:center;transform:rotate(-8deg);box-shadow:inset 0 0 0 3px rgba(22,138,85,.16);letter-spacing:1px}.certificate-table{width:100%;border-collapse:collapse;font-size:13px}.certificate-table td{padding:9px 6px;border-bottom:1px solid rgba(15,122,77,.08);vertical-align:top}.certificate-table td:first-child{width:42%;font-weight:800;color:#4d625a}.certificate-image{margin-top:16px;background:#fff;border:1px solid rgba(15,122,77,.12);border-radius:16px;padding:10px}.certificate-image img{display:block;width:100%;max-height:430px;object-fit:contain;border-radius:10px;background:#f3f7f5}.certificate-image-note{text-align:center;font-size:11px;color:#718078;margin:8px 0 0}@media(max-width:600px){.certificate-dialog{padding:23px;border-radius:22px;max-height:calc(100dvh - 28px)}.certificate-dialog h3{font-size:27px}.verified-stamp{width:108px;height:108px;font-size:15px}}
</style>

<div class="certificate-modal" id="certificateVerification" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="certificate-dialog">
    <button class="certificate-close" type="button" id="certificateClose">&times;</button>
    <div class="certificate-icon"><i class="fa-solid fa-certificate"></i></div>
    <h3>Certificate Verification</h3>
    <p>Enter Certificate No and Date of Birth exactly as registered.</p>
    <form id="certificateVerificationForm" novalidate>
      <label class="certificate-label" for="verifyCertificateNo">Certificate No *</label>
      <input class="certificate-input" id="verifyCertificateNo" required maxlength="100" placeholder="Enter Certificate No">
      <label class="certificate-label" for="verifyDob">Date Of Birth *</label>
      <input class="certificate-input" id="verifyDob" type="date" required>
      <button class="certificate-submit" type="submit"><i class="fa-solid fa-shield-halved"></i> Verify Certificate</button>
      <p class="certificate-status" id="certificateStatus"></p>
    </form>
    <div class="certificate-result" id="certificateResult"></div>
  </div>
</div>

<script>
(function(){
  const modal=document.getElementById('certificateVerification'),form=document.getElementById('certificateVerificationForm'),status=document.getElementById('certificateStatus'),resultBox=document.getElementById('certificateResult'),closeBtn=document.getElementById('certificateClose');
  function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
  function openCertificateVerification(){modal?.classList.add('open');modal?.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';setTimeout(()=>document.getElementById('verifyCertificateNo')?.focus(),100)}
  function closeCertificateVerification(){modal?.classList.remove('open');modal?.setAttribute('aria-hidden','true');document.body.style.overflow=''}
  window.openCertificateVerification=openCertificateVerification;
  closeBtn?.addEventListener('click',closeCertificateVerification);modal?.addEventListener('click',e=>{if(e.target===modal)closeCertificateVerification()});
  function resultHTML(p){const rows=[['Name',p.name],['Father\'s Name',p.fatherName],['Address',p.address],['Course Name',p.courseName],['Admission Date',p.admissionDate],['Date Of Birth',p.dateOfBirth],['Certificate No',p.certificateNo]];let img=p.certificateImageUrl?'<div class="certificate-image"><img src="'+esc(p.certificateImageUrl)+'" alt="Verified Certificate" loading="lazy"><p class="certificate-image-note">Certificate document</p></div>':'';return '<div class="certificate-stamp"><div class="verified-stamp">✓ VERIFIED<br>STUDENT</div></div><table class="certificate-table">'+rows.map(r=>'<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1]||'-')+'</td></tr>').join('')+'</table>'+img}
  form?.addEventListener('submit',async e=>{e.preventDefault();const certificateNo=String(document.getElementById('verifyCertificateNo').value||'').trim(),dateOfBirth=String(document.getElementById('verifyDob').value||'').trim();if(!certificateNo){status.className='certificate-status error';status.textContent='Please enter Certificate No.';return}if(!dateOfBirth){status.className='certificate-status error';status.textContent='Please select Date of Birth.';return}const btn=form.querySelector('button');btn.disabled=true;status.className='certificate-status';status.textContent='Verifying certificate...';try{const r=await apiCall('verifyCertificate',{certificateNo,dateOfBirth});if(!r?.success)throw new Error(r?.message||'Certificate verification failed.');resultBox.innerHTML=resultHTML(r.student||{});resultBox.classList.add('show');status.className='certificate-status success';status.textContent='Certificate verified successfully.'}catch(err){status.className='certificate-status error';status.textContent=err?.message||'Certificate not found or details do not match.'}finally{btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-shield-halved"></i> Verify Certificate'}});
})();
</script>
